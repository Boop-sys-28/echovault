<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EchoVault</title>
    <meta name="description" content="EchoVault — Sleek direct messaging platform with stories, privacy lock, and dynamic persona conversations." />
    <meta property="og:title" content="EchoVault" />
    <meta property="og:description" content="EchoVault — Sleek direct messaging platform with stories, privacy lock, and dynamic persona conversations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EchoVault" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#090a0f] text-slate-100 font-sans h-[100dvh] w-screen overflow-hidden select-none antialiased">
    <script>
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event.reason && event.reason.message) || String(event.reason || '');
        if (
          msg.indexOf('WebSocket closed without opened') !== -1 ||
          msg.indexOf('failed to connect to websocket') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
    <script>
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (key !== 'echovault-v3') {
              caches.delete(key);
            }
          });
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              reg.update();
            })
            .catch(function (err) {
              console.warn('Service worker registration failed: ', err);
            });
        });
      }
    </script>
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
